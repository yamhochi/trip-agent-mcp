# Builds and tests the package when a version tag is pushed (or when started by hand), dry-run publishes it, and
# builds the Claude Desktop extension (.mcpb), which is attached to the GitHub release on a tag.
# The real publish uses npm's trusted publishing: GitHub proves to npm which repository and workflow this is, and
# npm has been told on npmjs.com to trust `release.yml` of this repository, so no token is stored anywhere. It stays
# off until the repository variable PUBLISH_TO_NPM is set to "true".
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check that manifest.json and package.json have the same version
        run: |
          package="$(node -p "require('./package.json').version")"
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "${package}" != "${manifest}" ]; then
            echo "manifest.json says ${manifest} but package.json says ${package}" >&2
            exit 1
          fi
      - name: Check that the tag matches the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
      - name: Show what would be published
        run: npm pack --dry-run
      - name: Dry-run publish
        run: npm publish --dry-run --access public

  bundle:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the Claude Desktop extension (.mcpb)
        run: npm run build:mcpb
      - name: Keep the bundle as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: trip-agent-mcpb
          path: build/*.mcpb
          if-no-files-found: error
      - name: Attach the bundle to the GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; *) pre="" ;; esac
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes $pre
          fi
          gh release upload "$GITHUB_REF_NAME" build/*.mcpb --clobber

  publish:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_NPM == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # Trusted publishing needs npm 11.5.1 or later; the one that comes with Node 22 is older.
      - name: Upgrade npm
        run: npm install -g npm@latest
      - name: Publish (a prerelease version such as 1.0.0-rc.1 goes out under the "next" tag, not "latest")
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$version" in *-*) tag=next ;; *) tag=latest ;; esac
          npm publish --access public --provenance --tag "$tag"
